name: CarOk Store Auto Sync

on:
  schedule:
    # Runs daily at 03:00 AM Taiwan time (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync_car_inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run CarOk Automatic Scraper
        run: |
          python3 sync_carok.py

      - name: Commit and Push Updated Inventory
        run: |
          git config --global user.name "Li-Ho Auto Bot"
          git config --global user.email "bot@liho-auto.com"
          git add data/inventory.json app.js || true
          if git diff --staged --quiet; then
            echo "No inventory changes detected today."
          else
            git commit -m "Auto-sync CarOk store inventory [skip ci]"
            git push
          fi
