name: CarOk Store Auto Sync

on:
  schedule:
    # Runs daily at 03:00 AM Taiwan time (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# 新 repo 的 GITHUB_TOKEN 預設唯讀；沒有這一段，最後的 git push 會被 403 拒絕
permissions:
  contents: write

jobs:
  sync_car_inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CarOk Automatic Scraper
        run: |
          python3 sync_carok.py

      - name: Commit and Push Updated Inventory
        run: |
          git config --global user.name "Li-Ho Auto Bot"
          git config --global user.email "bot@liho-auto.com"
          git add data/inventory.json images/cars
          if git diff --staged --quiet; then
            echo "No inventory changes detected today."
          else
            git commit -m "Auto-sync CarOk store inventory [skip ci]"
            git push
          fi
