<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>力賀汽車 LI-HO AUTO ｜ 尊榮車務與車庫管理後台</title>
  <link rel="icon" href="images/liho_logo.jpg" type="image/jpeg">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldLight: '#F3E096',
              goldDark: '#AA820A',
              darkBg: '#0B0F17',
              cardBg: '#131A26',
              surface: '#1A2332',
              accent: '#E5C158',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brand-darkBg text-slate-100 font-sans antialiased selection:bg-brand-gold selection:text-black">

  <!-- Admin Top Bar -->
  <nav class="bg-brand-cardBg border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl overflow-hidden border border-brand-gold/50 shrink-0 bg-slate-900">
          <img src="images/liho_logo.jpg" alt="力賀汽車專屬圖標 LI-HO AUTO" class="w-full h-full object-cover">
        </div>
        <div>
          <span class="font-extrabold text-white text-base whitespace-nowrap">力賀汽車 ‧ 車務後台管理系統</span>
          <span class="text-xs text-brand-gold font-semibold ml-2 whitespace-nowrap">Li-Ho Admin Management Portal</span>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <a href="index.html" target="_blank" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition-colors flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="external-link" class="w-4 h-4 text-brand-gold"></i> 前往前台官網
        </a>
        <button onclick="resetToDefaultData()" class="px-3.5 py-1.5 rounded-lg bg-red-950/80 hover:bg-red-900 border border-red-500/40 text-red-200 text-xs font-semibold transition-colors flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 重置 CarOk 門市真實在庫車庫
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- Top Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-brand-cardBg p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 font-medium whitespace-nowrap">高雄門市在庫車數</div>
          <div class="text-3xl font-black text-brand-gold mt-1 whitespace-nowrap" id="stat-total-cars">0</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-brand-gold/10 text-brand-gold flex items-center justify-center">
          <i data-lucide="car" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-brand-cardBg p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 font-medium whitespace-nowrap">車庫總估值</div>
          <div class="text-3xl font-black text-emerald-400 mt-1 whitespace-nowrap" id="stat-total-value">$0 萬</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
          <i data-lucide="badge-dollar-sign" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-brand-cardBg p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 font-medium whitespace-nowrap">CarOk 權威認證車</div>
          <div class="text-3xl font-black text-amber-400 mt-1 whitespace-nowrap" id="stat-certified-cars">0</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-brand-cardBg p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 font-medium whitespace-nowrap">賞車預約數量</div>
          <div class="text-3xl font-black text-blue-400 mt-1 whitespace-nowrap" id="stat-bookings-count">0</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center">
          <i data-lucide="calendar" class="w-6 h-6"></i>
        </div>
      </div>
    </div>

    <!-- Main Content Tabs -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left: Add/Edit Form -->
      <div class="lg:col-span-5 bg-brand-cardBg p-6 rounded-3xl border border-brand-gold/30 shadow-2xl space-y-5">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <h2 class="text-lg font-extrabold text-white flex items-center gap-2 whitespace-nowrap" id="form-title">
            <i data-lucide="plus-circle" class="w-5 h-5 text-brand-gold"></i> 上架新車款資料
          </h2>
          <button onclick="resetCarForm()" class="text-xs text-slate-400 hover:text-white underline whitespace-nowrap">清空表單</button>
        </div>

        <form id="car-form" onsubmit="handleSaveCar(event)" class="space-y-4">
          <input type="hidden" id="car-edit-id" value="">

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">車輛完整名稱 *</label>
            <input type="text" id="car-title" required placeholder="例如：2021 Toyota COROLLA CROSS 1.8" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">廠牌 *</label>
              <select id="car-brand" required class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
                <option value="Toyota">Toyota 豐田</option>
                <option value="Mitsubishi">Mitsubishi 三菱</option>
                <option value="Subaru">Subaru 速霸陸</option>
                <option value="Honda">Honda 本田</option>
                <option value="Nissan">Nissan 日產</option>
                <option value="Mazda">Mazda 馬自達</option>
                <option value="Smart">Smart 司麥特</option>
                <option value="Volkswagen">Volkswagen 福斯</option>
                <option value="Benz">Benz 賓士</option>
                <option value="BMW">BMW 寶馬</option>
                <option value="Porsche">Porsche 保時捷</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">車型 *</label>
              <select id="car-type" required class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
                <option value="SUV">休旅車 SUV</option>
                <option value="Sedan">轎車/房車 Sedan</option>
                <option value="MPV">商務/休旅 MPV</option>
                <option value="Coupe">跑車 Coupe</option>
                <option value="EV">純電動車 EV</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">售價 (萬元) *</label>
              <input type="number" step="0.1" id="car-price" required placeholder="例如：56.8" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">出廠年份 *</label>
              <input type="number" id="car-year" required value="2021" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">行駛里程 *</label>
              <input type="text" id="car-mileage" required placeholder="例如：6.4 萬公里 (64,000 km)" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">認證標籤</label>
              <input type="text" id="car-certified" value="CarOk 認證" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">動力排氣量</label>
              <input type="text" id="car-power" placeholder="例如：1.8L (1798.cc)" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">變速系統</label>
              <input type="text" id="car-transmission" placeholder="例如：CVT 無段變速" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">車輛圖片路徑 (或圖片 URL) *</label>
            <input type="text" id="car-image" required placeholder="例如：images/corolla_cross_2021.jpg" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">標籤 (用逗號隔開)</label>
            <input type="text" id="car-tags" placeholder="熱門休旅, 非計程車, 里程保證" class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">車況詳細描述</label>
            <textarea id="car-description" rows="3" placeholder="簡述車況、配備與 CarOk 認證紀錄..." class="w-full bg-slate-900 text-slate-100 text-sm rounded-xl p-3 border border-slate-700 focus:border-brand-gold focus:outline-none"></textarea>
          </div>

          <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-gold to-brand-goldDark text-slate-950 font-black text-sm hover:brightness-110 transition-all shadow-lg flex items-center justify-center gap-2 whitespace-nowrap">
            <i data-lucide="save" class="w-4 h-4"></i> 儲存並發布至官網
          </button>
        </form>
      </div>

      <!-- Right: Inventory List -->
      <div class="lg:col-span-7 space-y-4">
        <div class="flex items-center justify-between bg-brand-cardBg p-4 rounded-2xl border border-slate-800">
          <h2 class="text-base font-bold text-white flex items-center gap-2 whitespace-nowrap">
            <i data-lucide="list" class="w-5 h-5 text-brand-gold"></i> 在庫車輛列表與管理
          </h2>
          <span class="text-xs text-slate-400 whitespace-nowrap">點擊編輯或下架即可連動官網</span>
        </div>

        <div class="space-y-3" id="admin-cars-list">
          <!-- Rendered dynamically by script -->
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderAdminDashboard();
    });

    function renderAdminDashboard() {
      const cars = getStoredCars();

      // Stats
      document.getElementById('stat-total-cars').innerText = cars.length;
      const totalVal = Math.round(cars.reduce((sum, c) => sum + (c.price || 0), 0) * 10) / 10;
      document.getElementById('stat-total-value').innerText = `$${totalVal} 萬`;
      const certifiedCount = cars.filter(c => (c.certified || '').includes('CarOk')).length;
      document.getElementById('stat-certified-cars').innerText = certifiedCount;

      const container = document.getElementById('admin-cars-list');
      if (!container) return;

      if (cars.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-brand-cardBg rounded-2xl border border-slate-800 text-slate-400 text-sm">
            目前無在庫車輛，請使用左側表單新增車輛。
          </div>
        `;
        return;
      }

      container.innerHTML = cars.map((car, index) => `
        <div class="bg-brand-cardBg p-4 rounded-2xl border border-slate-800 flex items-center justify-between gap-4 hover:border-brand-gold/40 transition-colors">
          <div class="flex items-center gap-4">
            <img src="${car.image}" class="w-20 h-16 object-cover rounded-xl border border-slate-700 shrink-0 bg-slate-900" onerror="this.src='images/corolla_cross_2021.jpg'">
            <div>
              <div class="flex items-center gap-2">
                <span class="bg-brand-gold/20 text-brand-gold text-[10px] font-bold px-2 py-0.5 rounded border border-brand-gold/30 whitespace-nowrap">${car.brand}</span>
                <span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded whitespace-nowrap">${car.year} 年 ｜ ${car.mileage}</span>
              </div>
              <h4 class="text-white font-bold text-sm mt-1 whitespace-nowrap">${car.title}</h4>
              <div class="text-xs text-brand-gold font-extrabold mt-0.5 whitespace-nowrap">NT$ ${car.price} 萬</div>
            </div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <button onclick="editCar('${car.id}')" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-brand-gold transition-colors text-xs font-semibold flex items-center gap-1 whitespace-nowrap">
              <i data-lucide="edit-3" class="w-4 h-4"></i> 編輯
            </button>
            <button onclick="deleteCar('${car.id}')" class="p-2 rounded-lg bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-500/30 transition-colors text-xs font-semibold flex items-center gap-1 whitespace-nowrap">
              <i data-lucide="trash-2" class="w-4 h-4"></i> 下架
            </button>
          </div>
        </div>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    function handleSaveCar(e) {
      e.preventDefault();
      const editId = document.getElementById('car-edit-id').value;

      const title = document.getElementById('car-title').value.trim();
      const brand = document.getElementById('car-brand').value;
      const type = document.getElementById('car-type').value;
      const price = parseFloat(document.getElementById('car-price').value) || 0;
      const year = parseInt(document.getElementById('car-year').value) || 2021;
      const mileage = document.getElementById('car-mileage').value.trim();
      const certified = document.getElementById('car-certified').value.trim() || 'CarOk 認證';
      const power = document.getElementById('car-power').value.trim() || '自然進氣';
      const transmission = document.getElementById('car-transmission').value.trim() || '手自排';
      const image = document.getElementById('car-image').value.trim();
      const tagsStr = document.getElementById('car-tags').value.trim();
      const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()) : ['實車實價'];
      const description = document.getElementById('car-description').value.trim();

      let cars = getStoredCars();

      if (editId) {
        cars = cars.map(c => c.id === editId ? {
          ...c, title, brand, type, price, year, mileage, certified, power, transmission, image, tags, description
        } : c);
      } else {
        const newCar = {
          id: 'car_' + Date.now(),
          title, brand, type, price, year, mileage, certified,
          guarantee: '三大保證 ‧ 實車實價',
          power, transmission, image, tags, description,
          inspection: [
            { item: '車體大樑與結構骨架', status: 'CarOk 認證無鈑修合格' },
            { item: 'CAROK 內視鏡檢查', status: '引擎內部無積碳極乾淨' }
          ]
        };
        cars.unshift(newCar);
      }

      saveStoredCars(cars);
      alert(editId ? '車輛資料已成功更新！' : '新車款已成功發布上架！');
      resetCarForm();
      renderAdminDashboard();
    }

    function editCar(id) {
      const cars = getStoredCars();
      const car = cars.find(c => c.id === id);
      if (!car) return;

      document.getElementById('form-title').innerHTML = `<i data-lucide="edit" class="w-5 h-5 text-brand-gold"></i> 編輯車輛資料 (ID: ${car.id})`;
      document.getElementById('car-edit-id').value = car.id;
      document.getElementById('car-title').value = car.title;
      document.getElementById('car-brand').value = car.brand;
      document.getElementById('car-type').value = car.type;
      document.getElementById('car-price').value = car.price;
      document.getElementById('car-year').value = car.year;
      document.getElementById('car-mileage').value = car.mileage;
      document.getElementById('car-certified').value = car.certified || 'CarOk 認證';
      document.getElementById('car-power').value = car.power || '';
      document.getElementById('car-transmission').value = car.transmission || '';
      document.getElementById('car-image').value = car.image;
      document.getElementById('car-tags').value = (car.tags || []).join(', ');
      document.getElementById('car-description').value = car.description || '';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCar(id) {
      if (!confirm('確定要下架此車款嗎？')) return;
      let cars = getStoredCars();
      cars = cars.filter(c => c.id !== id);
      saveStoredCars(cars);
      renderAdminDashboard();
    }

    function resetCarForm() {
      document.getElementById('car-edit-id').value = '';
      document.getElementById('form-title').innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5 text-brand-gold"></i> 上架新車款資料`;
      document.getElementById('car-form').reset();
    }

    function resetToDefaultData() {
      if (!confirm('確定要恢復 CarOk 門市真實在庫車庫嗎？')) return;
      localStorage.removeItem('liho_cars_data');
      renderAdminDashboard();
      alert('已恢復真實在庫車庫！');
    }
  </script>
</body>
</html>
